# =====================================================================
# Admin 后端配置
# ---------------------------------------------------------------------
# 分节顺序：1 配置引导 → 2 服务与日志 → 3 安全认证 → 4 依赖存储 → 5 业务配置
# 本文件始终最先加载（Nacos 的连接信息也来源于此），再按 configSource 决定是否覆盖
# 命令行 -cfs=nacos 优先级高于本文件的 configSource
# =====================================================================

# ---------------------------------------------------------------------
# 1. 配置引导
# ---------------------------------------------------------------------

# 配置来源：file = 本地配置文件（默认），nacos = Nacos 配置中心
configSource: file

# Nacos 配置中心（configSource=nacos 或命令行 -cfs=nacos 时生效）
nacos:
  host: '192.168.9.212'
  port: 8848
  namespace: 'c0e86a48-6cf9-4ebb-bd69-1a74e8ba2416'
  user: 'nacos'
  password: 'nacos'
  dataId: 'admin.yaml'
  group: 'hope_city2'
  cluster: "hope_city_admin"

# ---------------------------------------------------------------------
# 2. 服务与日志
# ---------------------------------------------------------------------

server:
  name: admin
  version: 1.0.3
  port: 3000
  # 调试模式：输出调试日志、记录验证码明文等，生产环境建议关闭
  debug: true
  # pprof 会无鉴权暴露 /debug/pprof，生产环境请关闭
  pprof: false

logger:
  filename: "./logs/admin.log"
  max_size: 5 # 单个日志文件最大 MB
  max_backups: 7 # 保留的归档文件数量
  max_age: 14 # 归档保留天数
  compress: true # 是否压缩归档
  level: debug # debug | info | warn | error
  json: true # 是否输出 JSON 格式
  # 同时输出到标准输出（容器/K8s 部署建议开启，便于 kubectl logs 采集）
  stdout: true

# ---------------------------------------------------------------------
# 3. 安全认证（JWT）
# ---------------------------------------------------------------------
# 生产环境建议通过 Secret / 环境变量注入密钥，不要提交到代码仓库
jwt:
  # token 生命周期（秒）：604800 = 7 天
  expire: 604800
  # 免鉴权路由；method 取 post | get，paths 支持 /xxx/* 前缀匹配
  # 注：/healthz、/readyz 注册在免鉴权路由组，无需在此配置
  ignores:
    - method: post
      paths:
        # 账号相关接口全部免鉴权（登录、验证码，以及登录后携带 token 主动请求的个人资料类接口）
        - /admin/account/*
        - /healthz
        - /readyz
    - method: get
      paths:
        - /swagger/*
  # RSA 公钥
  public: ""
  # RSA 私钥
  private: ""

# ---------------------------------------------------------------------
# 4. 依赖存储
# ---------------------------------------------------------------------

# MySQL 数据源
# 数据源：按数据库类型分组，未配置的类型不会初始化（当前支持 mysql、mongodb）
store:
  mysql:
    # 默认数据源名（对应 sources 的 key）；sources 为空时启动报错
    default: wei
    # 可配置多个数据源，key 为数据源名
    sources:
      wei:
        user: root
        pwd: "123456"
        host: 127.0.0.1
        port: 3306
        dbname: wei
        charset: utf8mb4
        parse_time: true
        location: Local
        max_idle_cons: 2
        max_open_cons: 20
        conn_max_lifetime_minutes: 200
  mongodb:
    # 默认数据源名；sources 为空表示不启用 MongoDB
    default: ""
    sources: {}
    # 示例：
    # sources:
    #   logs:
    #     uri: "mongodb://user:password@127.0.0.1:27017/?authSource=admin"
    #     database: logs
    #     max_pool_size: 100
    #     min_pool_size: 5
