# =====================================================================
# Admin 后端配置示例（部署模板）
# ---------------------------------------------------------------------
# 分节顺序：1 配置引导 → 2 服务与日志 → 3 安全认证 → 4 依赖存储 → 5 业务配置
# 说明：本文件仅为部署参考，密钥等敏感项请用 Secret / 环境变量注入，不要提交真实值。
# 实际运行时默认读取启动目录下的 config.yaml（-cfp 指定目录，-env dev 时读取 config-dev.yaml）。
# =====================================================================

# ---------------------------------------------------------------------
# 1. 配置引导
# ---------------------------------------------------------------------

# 配置来源：file = 本地配置文件（默认），nacos = Nacos 配置中心
configSource: file

# Nacos 配置中心（configSource=nacos 或命令行 -cfs=nacos 时生效）
nacos:
  host: '127.0.0.1'
  port: 8848
  namespace: 'public'
  user: 'nacos'
  password: 'nacos'
  dataId: 'admin.yaml'
  group: 'DEFAULT_GROUP'
  cluster: "hope_city_admin"

# ---------------------------------------------------------------------
# 2. 服务与日志
# ---------------------------------------------------------------------

server:
  name: admin
  version: 1.0.3
  port: 3000
  # 调试模式：输出调试日志、记录验证码明文等，生产环境建议关闭
  debug: false
  # pprof 会无鉴权暴露 /debug/pprof，生产环境请关闭
  pprof: false

logger:
  filename: "./logs/admin.log"
  max_size: 5 # 单个日志文件最大 MB
  max_backups: 7 # 保留的归档文件数量
  max_age: 14 # 归档保留天数
  compress: true # 是否压缩归档
  level: info # debug | info | warn | error
  json: true # 是否输出 JSON 格式
  # 同时输出到标准输出（容器/K8s 部署建议开启，便于 kubectl logs 采集）
  stdout: true

# ---------------------------------------------------------------------
# 3. 安全认证（JWT）
# ---------------------------------------------------------------------

jwt:
  # token 生命周期（秒）：604800 = 7 天
  expire: 604800
  # 免鉴权路由；method 取 post | get，paths 支持 /xxx/* 前缀匹配
  # 注：/healthz、/readyz 注册在免鉴权路由组，无需在此配置
  ignores:
    - method: post
      paths:
        # 账号相关接口全部免鉴权（登录、验证码，以及登录后携带 token 主动请求的个人资料类接口）
        - /admin/account/*
        - /healthz
        - /readyz
    - method: get
      paths:
        - /swagger/*
  # RSA 公私钥（base64 编码的 PEM），请通过 Secret 注入
  public: "<BASE64_RSA_PUBLIC_KEY>"
  private: "<BASE64_RSA_PRIVATE_KEY>"

# ---------------------------------------------------------------------
# 4. 依赖存储
# ---------------------------------------------------------------------

# MySQL 数据源
# 数据源：按数据库类型分组，未配置的类型不会初始化（当前支持 mysql、mongodb）
store:
  mysql:
    # 默认数据源名（对应 sources 的 key）；sources 为空时启动报错
    default: wei
    # 可配置多个数据源，key 为数据源名
    sources:
      wei:
        user: root
        pwd: "<DB_PASSWORD>"
        host: 127.0.0.1
        port: 3306
        dbname: wei
        charset: utf8mb4
        parse_time: true
        location: Local
        max_idle_cons: 2
        max_open_cons: 20
        conn_max_lifetime_minutes: 200
  mongodb:
    # 默认数据源名；sources 为空表示不启用 MongoDB
    default: ""
    sources: {}

# ---------------------------------------------------------------------
# 5. 业务配置
# ---------------------------------------------------------------------

# 文件上传
upload:
  # 存储驱动：local（本地磁盘，单机部署默认）| aliyun（阿里云 OSS）| qcloud（腾讯云 COS）| s3（亚马逊 S3 及 MinIO 等兼容实现）
  driver: local
  # 访问域名前缀（结尾不带斜杠），用于拼接返回给前端的文件链接
  # 本地单机部署填 http://127.0.0.1:<server.port>（例：http://127.0.0.1:3000），返回完整访问路径
  # 留空时：本地存储返回站点相对路径（/upload/...），云存储回退到厂商默认公网地址
  domain: "http://127.0.0.1:3000"
  # 单文件大小上限（MB），0 表示不限制
  max_size: 10
  # 允许上传的扩展名（小写、不含点），默认不限制（留空即不限制）
  # 如需限制请取消注释并按需填写，例如：jpg/jpeg/png/gif/webp/pdf/doc/docx/xls/xlsx/zip
  allowed_exts: []
  # 本地存储（driver=local 时生效）
  local:
    root: "./upload"
    prefix: "/upload"
  # 阿里云 OSS（driver=aliyun 时生效）
  aliyun:
    endpoint: ""
    access_key_id: ""
    access_key_secret: ""
    bucket: ""
    base_path: ""
  # 腾讯云 COS（driver=qcloud 时生效）
  qcloud:
    region: ""
    secret_id: ""
    secret_key: ""
    bucket: ""
    base_path: ""
  # S3 及兼容实现（driver=s3 时生效，如 MinIO）
  s3:
    region: ""
    access_key_id: ""
    access_key_secret: ""
    bucket: ""
    endpoint: ""
    base_path: ""
